[package]
name = "omarchy-plugin-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A local development, validation, deployment, and rollback workbench for Omarchy Quattro plugins"
license = "MIT"

[[bin]]
name = "omarchy-plugin-workbench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
