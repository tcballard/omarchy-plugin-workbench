name: Reproducible runtime

on:
  pull_request:
  push:
    branches: [main, fix/reproducible-release]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Bootstrap tag. This is replaced with the resolved immutable digest before merge.
  WORKBENCH_BUILD_IMAGE: rust:1.98.0-bookworm

jobs:
  verify-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve build environment
        run: |
          docker pull "$WORKBENCH_BUILD_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$WORKBENCH_BUILD_IMAGE" | tee "$RUNNER_TEMP/build-image.txt"
      - name: Build twice from locked source
        run: |
          WORKBENCH_CARGO_CACHE="$RUNNER_TEMP/cargo" scripts/build-reproducible.sh "$RUNNER_TEMP/build-a"
          WORKBENCH_CARGO_CACHE="$RUNNER_TEMP/cargo" scripts/build-reproducible.sh "$RUNNER_TEMP/build-b"
      - name: Verify reproducibility
        run: |
          cmp "$RUNNER_TEMP/build-a/release/omarchy-plugin-workbench" "$RUNNER_TEMP/build-b/release/omarchy-plugin-workbench"
          sha256sum "$RUNNER_TEMP/build-a/release/omarchy-plugin-workbench"
      - name: Commit bootstrap candidate and immutable build identity
        if: github.event_name == 'push' && github.ref_name == 'fix/reproducible-release' && hashFiles('bin/REPRODUCIBLE-RUNTIME') == ''
        run: |
          image="$(cat "$RUNNER_TEMP/build-image.txt")"
          runtime="$RUNNER_TEMP/build-a/release/omarchy-plugin-workbench"
          install -m 0755 "$runtime" bin/omarchy-plugin-workbench-x86_64
          sha256sum bin/omarchy-plugin-workbench-x86_64 > bin/SHA256SUMS
          printf 'builder-image=%s\nruntime-sha256=%s\nsource-commit=%s\n' \
            "$image" "$(sha256sum "$runtime" | cut -d ' ' -f 1)" "$GITHUB_SHA" \
            > bin/REPRODUCIBLE-RUNTIME
          sed -i "s|WORKBENCH_BUILD_IMAGE: rust:1.98.0-bookworm|WORKBENCH_BUILD_IMAGE: $image|" \
            .github/workflows/reproducible-runtime.yml
          sed -i "s|IMAGE_WITH_IMMUTABLE_SHA256_DIGEST|$image|" docs/reproducible-build.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/reproducible-runtime.yml docs/reproducible-build.md \
            bin/omarchy-plugin-workbench-x86_64 bin/SHA256SUMS bin/REPRODUCIBLE-RUNTIME
          git commit -m 'build: commit reproducible runtime candidate'
          git push origin HEAD:fix/reproducible-release
      - name: Compare committed runtime
        if: hashFiles('bin/REPRODUCIBLE-RUNTIME') != ''
        run: |
          cmp "$RUNNER_TEMP/build-a/release/omarchy-plugin-workbench" bin/omarchy-plugin-workbench-x86_64
          sha256sum --check bin/SHA256SUMS
      - name: Upload candidate and build identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-a/release/omarchy-plugin-workbench
            ${{ runner.temp }}/build-image.txt
          if-no-files-found: error
      - name: Attest committed runtime provenance
        if: github.event_name == 'push' && hashFiles('bin/REPRODUCIBLE-RUNTIME') != ''
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: bin/omarchy-plugin-workbench-x86_64
